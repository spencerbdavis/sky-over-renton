# sky-web: the Sky over Renton app on :8504
#   /        the app (web/), /data/ readsb live JSON + traces, /api/ sky-api, /classic/ stock tar1090
server {
  listen 80;
  root /srv/sky;
  index index.html;
  gzip on;
  gzip_types application/json application/javascript text/css application/manifest+json image/svg+xml;
  gzip_min_length 512;

  location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
  location ~ \.(js|css|png)$ { add_header Cache-Control "public, max-age=2592000"; }
  location /data/ { proxy_pass http://ultrafeeder/data/; proxy_set_header Host $host; add_header Cache-Control "no-cache"; }
  location /api/ { proxy_pass http://sky-api:8080/api/; proxy_set_header Host $host; }
  location = /classic { return 301 /classic/; }
  location /classic/ { proxy_pass http://ultrafeeder/; proxy_set_header Host $host; }
  location /graphs1090/ { proxy_pass http://ultrafeeder/graphs1090/; proxy_set_header Host $host; }
}

# Public site (the internet, via the Cloudflare tunnel in docker-compose; nothing is published
# on the host). Same app, but only what it needs, and nothing that locates the receiver:
#   /data/aircraft.json  -> sky-api's copy without r_dst/r_dir (per-plane range/bearing from the antenna)
#   /data/receiver.json  -> a coarse Renton point
#   /data/outline.json, /data/traces/  as is (coverage shape, flown paths: no receiver position)
#   /api/log, best, rate: airframe log, best range, message rate (no positions). /api/range (range by
#   bearing) is private-only: not listed below, so it 404s here.
#   no /classic/, /graphs1090/, stats or other readsb files; lookups rate limited per visitor.
limit_req_zone $http_cf_connecting_ip zone=pubapi:10m rate=30r/m;
limit_req_zone $http_cf_connecting_ip zone=pubdata:10m rate=5r/s;
limit_req_zone $http_cf_connecting_ip zone=pubv1:10m rate=60r/m;
server {
  listen 8080;
  root /srv/sky;
  index index.html;
  server_tokens off;
  gzip on;
  gzip_types application/json application/javascript text/css application/manifest+json image/svg+xml;
  gzip_min_length 512;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  limit_req_status 429;

  location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
  location ~ \.(js|css|png)$ { add_header Cache-Control "public, max-age=2592000"; }
  location = /data/aircraft.json { limit_req zone=pubdata burst=10 nodelay; proxy_pass http://sky-api:8080/api/pub/aircraft.json; add_header Cache-Control "no-cache"; }
  location = /data/receiver.json { proxy_pass http://sky-api:8080/api/pub/receiver.json; }
  location = /data/outline.json { proxy_pass http://ultrafeeder/data/outline.json; add_header Cache-Control "max-age=300"; }
  location /data/traces/ { limit_req zone=pubdata burst=10 nodelay; proxy_pass http://ultrafeeder/data/traces/; add_header Cache-Control "no-cache"; }
  location /data/ { return 404; }
  location = /api/v1/now { limit_req zone=pubv1 burst=20 nodelay; proxy_pass http://sky-api:8080; }
  location ~ ^/api/(ac/|fill$|stats$|log$|best$|rate$) { limit_req zone=pubapi burst=20 nodelay; proxy_pass http://sky-api:8080; }
  location /api/ { return 404; }
  location /classic { return 404; }
  location /graphs1090 { return 404; }
}
